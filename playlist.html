<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist Spotify</title>
    <link rel="stylesheet" href="playlist.css" />
  </head>
  <body>
    <a href="/index.html" class="back-button">⬅ Tornar</a>
    <div class="container">
      <h1>Gestionar Playlist</h1>
      <div id="content">
        <div id="playlists">
          <h2>Playlists</h2>
          <div id="playlist-container"></div>
          <input
            type="text"
            id="playlistNameInput"
            placeholder="Nom de la playlist"
          />
          <button id="updatePlaylistButton">Modificar Nom</button>
        </div>
        <div id="songs">
          <h2>Cançons</h2>
          <div id="tracks-container"></div>
        </div>
        <div id="selected-songs">
          <h2>Cançons Seleccionades</h2>
          <div id="saved-tracks-container"></div>
        </div>
      </div>
    </div>
    <script type="module" src="playlist.js"></script>
  </body>
</html>
